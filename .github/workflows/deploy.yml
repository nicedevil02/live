name: 🚀 Deploy to Live Server

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: ⚡ Sync to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Sync changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          server-dir: ./
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env*
            **/vendor/**
            **/node_modules/**
            **/storage/**
            **/tests/**
            *.zip
            .cpanel.yml

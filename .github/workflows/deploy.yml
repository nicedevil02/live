name: 🚀 Deploy to Live Server

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: ⚡ Trigger cPanel Live Sync
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Ping Deployment Webhook
        run: |
          response=$(curl -k -s -w "\n%{http_code}" "https://talalive.ir/deploy-run.php?key=tala_deploy_7f8c9b1e2a3d4f5")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Server Response:"
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Deployment failed with HTTP $http_code"
            exit 1
          fi
